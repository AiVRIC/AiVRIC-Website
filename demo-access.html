<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AiVRIC Demo Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.08);
      --panel-border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --danger: #ff5c7c;
      --accent: #00d4ff;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(0,212,255,0.18), transparent 60%),
                  linear-gradient(180deg, #050814, #070b18);
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate-container {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 560px){
      .grid-2 { grid-template-columns: 1fr; }
    }

    input,
    select {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    /* FIX: Dropdown readability */
    select option {
      color: #111;
      background: #ffffff;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .error {
      display: none;
      margin-top: -8px;
      margin-bottom: 14px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(90deg, #00d4ff, #4ae3c1);
      color: #041018;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <form class="gate-container" id="demoGateForm" novalidate>
    <div class="logo">AiVRIC Demo Access</div>
    <div class="subtitle">
      Tell us a bit about your use case to continue into the live AiVRIC demo environment.
    </div>

    <!-- Name -->
    <div class="grid-2">
      <div>
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="First name"
          autocomplete="given-name"
          required
          minlength="2"
        />
      </div>
      <div>
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Last name"
          autocomplete="family-name"
          required
          minlength="2"
        />
      </div>
    </div>

    <!-- Phone -->
    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="+1 954 342 6637"
      autocomplete="tel"
      required
      inputmode="tel"
      pattern="^[0-9+()\-.\s]{7,}$"
    />
    <div class="error" id="phoneError">Please enter a valid phone number.</div>

    <!-- Business Email -->
    <label for="email">Business Email</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@company.com"
      autocomplete="work email"
      required
    />
    <div class="error" id="emailError">
      Please use a business email address (personal email domains are not permitted).
    </div>

    <!-- Primary Use Case -->
    <label for="usecase">Primary Security Use Case</label>
    <select id="usecase" name="usecase" required>
      <option value="" disabled selected>Select a use case</option>
      <option value="github">GitHub / SDLC Security</option>
      <option value="cloud">Cloud Security Posture (CSPM)</option>
      <option value="kubernetes">Kubernetes Security</option>
      <option value="compliance">SOC 2 / Compliance Readiness</option>
      <option value="multi-cloud">Multi-Cloud Security Posture</option>
    </select>

    <!-- Company Size -->
    <label for="size">Organization Size</label>
    <select id="size" name="size" required>
      <option value="" disabled selected>Select organization size</option>
      <option value="startup">Startup (1–50)</option>
      <option value="smb">SMB (51–250)</option>
      <option value="mid">Mid-Market (251–1,000)</option>
      <option value="enterprise">Enterprise (1,000+)</option>
    </select>

    <!-- Submit -->
    <button type="submit" class="btn">
      Continue to Demo
    </button>

    <div class="footer-note">
      This demo environment is pre-configured for exploration only.
    </div>
  </form>

  <script>
    (function () {
      const form = document.getElementById('demoGateForm');
      const emailEl = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const phoneEl = document.getElementById('phone');
      const phoneError = document.getElementById('phoneError');

      // Blocklist of consumer/personal email domains
      // (Add/remove as you see fit.)
      const blockedDomains = new Set([
        "gmail.com","googlemail.com",
        "yahoo.com","yahoo.co.uk","yahoo.ca","yahoo.com.au",
        "hotmail.com","outlook.com","live.com","msn.com",
        "aol.com",
        "icloud.com","me.com","mac.com",
        "proton.me","protonmail.com",
        "gmx.com","gmx.net",
        "mail.com",
        "zoho.com",        // optional: remove if you want to allow business Zoho users
        "fastmail.com",
        "yandex.com","yandex.ru",
        "qq.com","163.com","126.com",
        "comcast.net","verizon.net","att.net","sbcglobal.net","cox.net","charter.net"
      ]);

      function getDomain(email) {
        const at = email.lastIndexOf('@');
        if (at === -1) return "";
        return email.slice(at + 1).trim().toLowerCase();
      }

      function isBusinessEmail(email) {
        const domain = getDomain(email);
        if (!domain) return false;
        // Reject blocked personal domains
        if (blockedDomains.has(domain)) return false;

        // Basic sanity: must include a dot and not end with dot
        if (!domain.includes('.') || domain.endsWith('.')) return false;

        return true;
      }

      function show(el) { el.style.display = 'block'; }
      function hide(el) { el.style.display = 'none'; }

      function validateEmailField() {
        const email = emailEl.value.trim();
        // Let browser handle empty/format issues; we add the "business domain" constraint
        if (!emailEl.checkValidity()) {
          hide(emailError);
          return false;
        }
        if (!isBusinessEmail(email)) {
          show(emailError);
          return false;
        }
        hide(emailError);
        return true;
      }

      function validatePhoneField() {
        const ok = phoneEl.checkValidity();
        if (!ok) show(phoneError);
        else hide(phoneError);
        return ok;
      }

      emailEl.addEventListener('blur', validateEmailField);
      emailEl.addEventListener('input', () => { if (emailError.style.display === 'block') validateEmailField(); });

      phoneEl.addEventListener('blur', validatePhoneField);
      phoneEl.addEventListener('input', () => { if (phoneError.style.display === 'block') validatePhoneField(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Trigger native validation UI for required fields
        if (!form.checkValidity()) {
          form.reportValidity();
          // Still show our custom errors if relevant
          validateEmailField();
          validatePhoneField();
          return;
        }

        const emailOk = validateEmailField();
        const phoneOk = validatePhoneField();

        if (!emailOk || !phoneOk) return;

        // Optional: capture values for analytics / API later
        // const data = Object.fromEntries(new FormData(form).entries());
        // fetch('/api/demo-intake', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });

        // Redirect to demo login page
        window.location.href = "https://dev-defense.aivric.com";
      });
    })();
  </script>

</body>
</html>
