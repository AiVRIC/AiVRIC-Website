<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AiVRIC Demo Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.08);
      --panel-border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent: #00d4ff;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(0,212,255,0.18), transparent 60%),
                  linear-gradient(180deg, #050814, #070b18);
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate-container {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    input,
    select {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
    }

    /* FIX: Dropdown readability */
    select option {
      color: #111;
      background: #ffffff;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(90deg, #00d4ff, #4ae3c1);
      color: #041018;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <form class="gate-container" id="demoGateForm">
    <div class="logo">AiVRIC Demo Access</div>
    <div class="subtitle">
      Tell us a bit about your use case to continue into the live AiVRIC demo environment.
    </div>

    <!-- Business Email -->
    <label for="email">Business Email</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@company.com"
      required
    />

    <!-- Primary Use Case -->
    <label for="usecase">Primary Security Use Case</label>
    <select id="usecase" name="usecase" required>
      <option value="" disabled selected>Select a use case</option>
      <option value="github">GitHub / SDLC Security</option>
      <option value="cloud">Cloud Security Posture (CSPM)</option>
      <option value="kubernetes">Kubernetes Security</option>
      <option value="compliance">SOC 2 / Compliance Readiness</option>
      <option value="multi-cloud">Multi-Cloud Security Posture</option>
    </select>

    <!-- Company Size -->
    <label for="size">Organization Size</label>
    <select id="size" name="size" required>
      <option value="" disabled selected>Select organization size</option>
      <option value="startup">Startup (1–50)</option>
      <option value="smb">SMB (51–250)</option>
      <option value="mid">Mid-Market (251–1,000)</option>
      <option value="enterprise">Enterprise (1,000+)</option>
    </select>

    <!-- Submit -->
    <button type="submit" class="btn">
      Continue to Demo
    </button>

    <div class="footer-note">
      This demo environment is pre-configured for exploration only.
    </div>
  </form>

  <script>
    document.getElementById('demoGateForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // Optional: capture values for analytics / API later
      const formData = new FormData(this);

      // TODO (optional later):
      // fetch('/api/demo-intake', { method: 'POST', body: formData });

      // Redirect to demo login
      window.location.href = "https://dev-defense.aivric.com";
    });
  </script>

</body>
</html>
